<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Case workspace prototype</title>
  <!-- Three variants of the Case workspace, switchable via ?variant=A|B|C, on a standalone throwaway route because the application shell does not exist yet. -->
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --ink: #eef4f7;
      --muted: #8ea0a8;
      --line: rgba(255,255,255,.09);
      --panel: rgba(18,27,31,.88);
      --panel-2: rgba(28,39,44,.88);
      --cyan: #6de0d1;
      --amber: #f1b868;
      --red: #ff7878;
      --shadow: 0 24px 70px rgba(0,0,0,.34);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #091013; color: var(--ink); }
    body { min-height: 100vh; overflow-x: hidden; }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
    .app { min-height: 100vh; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
    .icon { width: 18px; height: 18px; display: inline-grid; place-items: center; flex: 0 0 auto; }
    .icon svg { width: 100%; height: 100%; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .plain-button { border: 0; background: transparent; cursor: pointer; }
    .pill { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: 999px; padding: 7px 10px; color: var(--muted); background: rgba(255,255,255,.035); font-size: 12px; }
    .pill.good { color: #8ce5b7; border-color: rgba(93,210,146,.25); background: rgba(35,125,76,.16); }
    .pill.warn { color: #f5c77f; border-color: rgba(241,184,104,.28); background: rgba(151,93,27,.15); }
    .eyebrow { color: var(--cyan); text-transform: uppercase; letter-spacing: .16em; font-size: 10px; font-weight: 750; }
    .muted { color: var(--muted); }
    .fine { font-size: 12px; }
    .card { border: 1px solid var(--line); background: var(--panel); border-radius: 14px; box-shadow: var(--shadow); }
    .tag { display: inline-flex; align-items: center; border-radius: 6px; padding: 4px 7px; font-size: 10px; font-weight: 700; letter-spacing: .03em; background: rgba(109,224,209,.1); color: var(--cyan); border: 1px solid rgba(109,224,209,.18); }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 0 4px rgba(109,224,209,.1); }
    .avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg,#d9a963,#755c3e); color: #101315; font-weight: 800; }
    .citation { border: 1px solid rgba(109,224,209,.22); background: rgba(109,224,209,.08); color: #a8eee4; border-radius: 5px; padding: 1px 5px; font-size: 10px; cursor: pointer; vertical-align: 1px; }
    .tool-button { border: 1px solid var(--line); background: rgba(255,255,255,.045); border-radius: 9px; padding: 9px 11px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
    .tool-button.primary { background: var(--cyan); border-color: var(--cyan); color: #07100f; font-weight: 750; }
    .tool-button:hover { filter: brightness(1.12); }
    .case-photo { position: relative; min-height: 150px; border-radius: 11px; overflow: hidden; background: linear-gradient(145deg,#183b46,#0b161b 60%); }
    .case-photo svg { width: 100%; height: 100%; position: absolute; inset: 0; }
    .case-photo::after { content: "FICTIONAL DEMO IMAGE"; position: absolute; bottom: 8px; right: 9px; font-size: 8px; letter-spacing: .12em; color: rgba(255,255,255,.62); }
    .link-preview { display: grid; grid-template-columns: 54px 1fr; gap: 11px; padding: 11px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,.025); cursor: pointer; text-align: left; width: 100%; }
    .link-preview:hover { border-color: rgba(109,224,209,.32); background: rgba(109,224,209,.04); }
    .link-thumb { border-radius: 8px; display: grid; place-items: center; background: linear-gradient(135deg,#253f4a,#152229); color: var(--cyan); font-weight: 900; }
    .link-title { font-size: 12px; font-weight: 730; margin-bottom: 4px; }
    .link-url { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Variant A: a persistent, high-density command center. */
    .variant-a { background: radial-gradient(circle at 70% -10%,rgba(32,112,117,.22),transparent 33%), #091013; min-height: 100vh; }
    .a-topbar { height: 62px; display: grid; grid-template-columns: 250px minmax(300px,620px) 1fr; align-items: center; gap: 24px; padding: 0 18px; border-bottom: 1px solid var(--line); background: rgba(7,13,16,.92); position: sticky; top: 0; z-index: 5; backdrop-filter: blur(18px); }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 760; letter-spacing: -.02em; }
    .brand-mark { width: 28px; height: 28px; border-radius: 8px; border: 1px solid rgba(109,224,209,.35); background: radial-gradient(circle at 50% 50%,var(--cyan) 0 2px,transparent 3px), linear-gradient(135deg,rgba(109,224,209,.2),transparent); box-shadow: inset 0 0 18px rgba(109,224,209,.16); }
    .global-search { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.035); border-radius: 10px; padding: 0 12px; height: 38px; }
    .global-search input { border: 0; outline: 0; background: transparent; color: var(--ink); width: 100%; }
    .a-top-actions { display: flex; justify-content: flex-end; align-items: center; gap: 9px; }
    .a-shell { display: grid; grid-template-columns: 210px 230px minmax(420px,1fr) 290px; min-height: calc(100vh - 62px); }
    .a-case-rail, .a-folders, .a-agent { border-right: 1px solid var(--line); background: rgba(9,16,19,.82); padding: 16px 12px 90px; }
    .a-folders { background: rgba(13,21,24,.88); }
    .a-agent { border-right: 0; border-left: 1px solid var(--line); }
    .rail-label { padding: 5px 8px 10px; color: #71858e; font-size: 10px; text-transform: uppercase; letter-spacing: .14em; font-weight: 750; }
    .case-row { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 9px; width: 100%; padding: 10px 9px; border: 0; border-radius: 10px; background: transparent; color: var(--ink); text-align: left; cursor: pointer; margin-bottom: 4px; }
    .case-row.active { background: rgba(109,224,209,.09); box-shadow: inset 2px 0 var(--cyan); }
    .case-row:hover { background: rgba(255,255,255,.04); }
    .case-code { font-size: 9px; color: #6f838b; }
    .case-name { font-size: 12px; font-weight: 700; margin-top: 2px; }
    .case-badge { width: 25px; height: 25px; border-radius: 7px; background: #1c3037; display: grid; place-items: center; font-size: 10px; font-weight: 800; }
    .folder-row { display: flex; align-items: center; gap: 9px; width: 100%; border: 0; background: transparent; color: #9cacb3; padding: 8px 9px; border-radius: 8px; cursor: pointer; text-align: left; font-size: 12px; }
    .folder-row span:last-child { margin-left: auto; font-size: 10px; color: #607078; }
    .folder-row.active { color: var(--ink); background: rgba(255,255,255,.055); }
    .folder-children { margin-left: 14px; padding-left: 8px; border-left: 1px solid var(--line); }
    .a-main { min-width: 0; padding: 22px 24px 100px; }
    .case-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
    .case-heading h1 { margin: 4px 0 6px; font-size: 25px; letter-spacing: -.035em; }
    .case-heading-actions { display: flex; gap: 8px; }
    .view-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
    .view-tab { border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); padding: 9px 11px 11px; cursor: pointer; }
    .view-tab.active { color: var(--ink); border-color: var(--cyan); }
    .summary-grid { display: grid; grid-template-columns: minmax(0,1.25fr) minmax(240px,.75fr); gap: 14px; }
    .summary-card { padding: 18px; }
    .summary-card h2 { margin: 6px 0 10px; font-size: 17px; }
    .summary-card p { color: #bdc9ce; font-size: 13px; line-height: 1.65; margin: 0 0 12px; }
    .signal-list { display: grid; gap: 8px; }
    .signal { padding: 11px; border-radius: 9px; background: rgba(255,255,255,.03); border: 1px solid var(--line); display: grid; grid-template-columns: 3px 1fr; gap: 10px; }
    .signal-bar { background: var(--amber); border-radius: 9px; }
    .signal b { font-size: 12px; }
    .signal div div { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
    .evidence-strip { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 12px; margin-top: 14px; }
    .evidence-card { overflow: hidden; cursor: pointer; text-align: left; color: inherit; padding: 0; }
    .evidence-card .case-photo { border-radius: 13px 13px 0 0; min-height: 112px; }
    .evidence-meta { padding: 11px 12px 13px; }
    .evidence-meta b { display: block; font-size: 12px; margin-bottom: 5px; }
    .evidence-meta span { color: var(--muted); font-size: 10px; }
    .a-agent-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 13px; }
    .a-agent-title { display: flex; align-items: center; gap: 9px; }
    .model-select { width: 100%; border: 1px solid var(--line); background: #111d21; color: var(--ink); border-radius: 9px; padding: 9px 10px; margin-bottom: 13px; }
    .agent-event { display: grid; grid-template-columns: 24px 1fr; gap: 9px; padding: 11px 0; border-top: 1px solid var(--line); }
    .agent-event:first-of-type { border-top: 0; }
    .event-icon { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 7px; background: rgba(109,224,209,.1); color: var(--cyan); font-size: 10px; }
    .agent-event b { font-size: 11px; display: block; margin-bottom: 4px; }
    .agent-event p { margin: 0; font-size: 10px; color: var(--muted); line-height: 1.45; }
    .chat-box { position: sticky; top: calc(100vh - 105px); margin-top: 16px; }
    .chat-box textarea { width: 100%; min-height: 68px; resize: none; border: 1px solid var(--line); background: #0e181c; color: var(--ink); border-radius: 10px; padding: 10px; }

    /* Variant B: a light, artifact-first evidence desk. */
    .variant-b { --ink: #202729; --muted: #718084; --line: rgba(28,43,47,.13); --panel: #ffffff; --panel-2: #f4f6f4; --cyan: #087f76; --amber: #9d641c; color-scheme: light; min-height: 100vh; background: #ecefeb; color: var(--ink); }
    .b-header { height: 68px; padding: 0 26px; background: #f8faf7; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 22px; }
    .b-header .brand-mark { background-color: #dcecea; }
    .b-breadcrumb { display: flex; gap: 7px; align-items: center; font-size: 12px; color: var(--muted); }
    .b-breadcrumb b { color: var(--ink); }
    .b-case-search { margin-left: auto; width: min(420px,36vw); display: flex; align-items: center; gap: 9px; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px; }
    .b-case-search input { width: 100%; background: transparent; border: 0; outline: 0; color: var(--ink); }
    .b-workspace { display: grid; grid-template-columns: 265px minmax(520px,1fr); min-height: calc(100vh - 68px); }
    .b-sidebar { border-right: 1px solid var(--line); background: #f7f8f5; padding: 20px 16px 90px; }
    .b-case-card { padding: 14px; background: #e7efeb; border: 1px solid #d2dfd9; border-radius: 13px; margin-bottom: 20px; }
    .b-case-card h2 { font-size: 16px; margin: 4px 0; }
    .b-case-card p { font-size: 11px; color: var(--muted); margin: 0; }
    .b-folder { width: 100%; display: flex; align-items: center; gap: 10px; border: 0; border-radius: 9px; padding: 10px; background: transparent; color: var(--muted); cursor: pointer; text-align: left; }
    .b-folder.active { background: #fff; color: var(--ink); box-shadow: 0 3px 12px rgba(40,56,52,.08); }
    .b-folder strong { margin-left: auto; font-size: 10px; background: #e8ece9; padding: 3px 6px; border-radius: 5px; }
    .b-main { min-width: 0; display: grid; grid-template-rows: auto 1fr; }
    .b-toolbar { padding: 15px 20px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); background: rgba(248,250,247,.88); position: sticky; top: 0; z-index: 2; }
    .b-toolbar .tool-button { background: #fff; }
    .b-toolbar .primary { background: #087f76; color: #fff; }
    .b-toolbar-spacer { flex: 1; }
    .b-canvas { min-width: 0; padding: 20px 20px 100px; }
    .b-queue { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 13px; }
    .queue-card { flex: 0 0 195px; border: 1px solid var(--line); background: #fff; border-radius: 11px; padding: 11px; cursor: pointer; }
    .queue-card.selected { border-color: #0b8f83; box-shadow: 0 0 0 2px rgba(11,143,131,.1); }
    .queue-card b { display: block; font-size: 11px; margin: 7px 0 4px; }
    .queue-card span { color: var(--muted); font-size: 10px; }
    .queue-icon { width: 34px; height: 26px; border-radius: 6px; background: #e2ece9; display: grid; place-items: center; color: #087f76; font-size: 10px; font-weight: 800; }
    .b-desk { display: grid; grid-template-columns: minmax(380px,1.2fr) minmax(280px,.8fr); gap: 15px; min-height: 550px; }
    .document-viewer { background: #1f292b; border-radius: 14px; padding: 15px; color: #eff5f3; display: grid; grid-template-rows: auto 1fr auto; box-shadow: 0 18px 50px rgba(33,46,43,.16); }
    .doc-head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; }
    .doc-stage { min-height: 360px; border-radius: 10px; overflow: hidden; background: #0c1214; }
    .doc-stage .case-photo { height: 100%; min-height: 360px; border-radius: 10px; }
    .doc-footer { display: flex; justify-content: space-between; gap: 15px; padding-top: 12px; color: #aebcbe; font-size: 10px; }
    .notebook { display: grid; grid-template-rows: auto auto 1fr; gap: 12px; }
    .paper { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 15px; box-shadow: 0 10px 25px rgba(41,55,51,.07); }
    .paper h3 { margin: 4px 0 10px; font-size: 14px; }
    .paper p { margin: 0; font-size: 12px; line-height: 1.55; color: #58666a; }
    .fact-row { padding: 10px 0; border-top: 1px solid var(--line); }
    .fact-row:first-child { border-top: 0; padding-top: 0; }
    .fact-row b { font-size: 11px; display: block; margin-bottom: 3px; }
    .fact-row span { font-size: 10px; color: var(--muted); }
    .b-agent-prompt { display: flex; gap: 8px; margin-top: 11px; }
    .b-agent-prompt input { min-width: 0; flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 9px; }

    /* Variant C: a calm narrative briefing with progressive disclosure. */
    .variant-c { --ink: #f3f0ea; --muted: #9a9c9b; --line: rgba(255,255,255,.1); --panel: #16191b; --panel-2: #1c2022; --cyan: #b4efdf; --amber: #ffbf69; color-scheme: dark; min-height: 100vh; background: #0d0f10; color: var(--ink); }
    .c-shell { min-height: 100vh; display: grid; grid-template-columns: 232px minmax(560px,1fr) 320px; }
    .c-dock { border-right: 1px solid var(--line); padding: 18px 14px 95px; display: flex; flex-direction: column; gap: 7px; background: #0a0c0d; }
    .dock-brand { display: flex; align-items: center; gap: 10px; padding: 0 7px 15px; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
    .dock-brand b, .dock-profile b { display: block; font-size: 12px; }
    .dock-brand small, .dock-profile small, .dock-case small { display: block; margin-top: 2px; color: #717b79; font-size: 9px; }
    .dock-logo { flex: 0 0 38px; width: 38px; height: 38px; border-radius: 12px; border: 1px solid rgba(180,239,223,.28); display: grid; place-items: center; color: var(--cyan); font-weight: 900; }
    .dock-label { margin: 10px 9px 3px; color: #65706e; font-size: 9px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .dock-button { width: 100%; min-height: 40px; padding: 8px 10px; border: 1px solid transparent; border-radius: 10px; background: transparent; color: #848d8b; display: grid; grid-template-columns: 20px 1fr; gap: 9px; align-items: center; text-align: left; cursor: pointer; }
    .dock-button.active, .dock-button:hover { color: var(--ink); background: #171b1c; border-color: var(--line); }
    .dock-case { width: 100%; padding: 8px 9px; border: 1px solid transparent; border-radius: 11px; background: transparent; color: #8f9795; display: grid; grid-template-columns: 30px 1fr auto; gap: 9px; align-items: center; text-align: left; cursor: pointer; }
    .dock-case:hover, .dock-case.active { color: var(--ink); background: rgba(180,239,223,.06); border-color: rgba(180,239,223,.12); }
    .dock-case .mini-avatar { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: #182628; color: var(--cyan); font-size: 10px; font-weight: 800; }
    .dock-case b { display: block; font-size: 11px; }
    .dock-case .case-state { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 9px rgba(180,239,223,.55); }
    .dock-spacer { flex: 1; }
    .dock-profile { display: grid; grid-template-columns: 34px 1fr; gap: 9px; align-items: center; padding: 12px 8px 0; margin-top: 5px; border-top: 1px solid var(--line); }
    .c-brief { min-width: 0; padding: 27px clamp(24px,4vw,68px) 110px; background: radial-gradient(circle at 50% -20%,rgba(71,108,100,.16),transparent 32%); }
    .c-command { max-width: 740px; margin: 0 auto 30px; display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; background: #15191a; box-shadow: 0 18px 45px rgba(0,0,0,.25); }
    .c-command input { width: 100%; border: 0; outline: 0; color: var(--ink); background: transparent; }
    .c-header { max-width: 740px; margin: 0 auto 26px; }
    .c-header h1 { font-family: Georgia,serif; font-weight: 450; font-size: clamp(32px,5vw,52px); line-height: 1.05; letter-spacing: -.04em; margin: 8px 0 10px; }
    .c-header-line { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
    .brief-section { max-width: 740px; margin: 0 auto; }
    .brief-title { display: flex; align-items: center; justify-content: space-between; margin: 28px 0 12px; }
    .brief-title h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .13em; margin: 0; }
    .narrative { position: relative; padding-left: 34px; }
    .narrative::before { content: ""; position: absolute; left: 10px; top: 10px; bottom: 10px; width: 1px; background: linear-gradient(var(--cyan),rgba(255,255,255,.08)); }
    .story-card { position: relative; border: 1px solid var(--line); background: #151819; border-radius: 16px; padding: 18px; margin-bottom: 12px; }
    .story-card::before { content: ""; position: absolute; left: -29px; top: 23px; width: 9px; height: 9px; border-radius: 50%; background: #0d0f10; border: 2px solid var(--cyan); }
    .story-card.feature { display: grid; grid-template-columns: minmax(0,1fr) 180px; gap: 18px; }
    .story-card h3 { margin: 5px 0 8px; font: 450 22px/1.2 Georgia,serif; }
    .story-card p { margin: 0 0 10px; color: #b5b6b3; font-size: 13px; line-height: 1.62; }
    .story-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .story-link { border: 0; background: transparent; color: var(--cyan); cursor: pointer; padding: 0; font-size: 11px; }
    .c-side { border-left: 1px solid var(--line); background: #111415; padding: 24px 18px 95px; }
    .pulse-head { display: flex; align-items: center; justify-content: space-between; }
    .pulse-head h2 { margin: 0; font-size: 14px; }
    .pulse-number { font: 400 42px/1 Georgia,serif; margin: 20px 0 4px; }
    .pulse-label { color: var(--muted); font-size: 11px; margin-bottom: 20px; }
    .pulse-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 11px 0; border-top: 1px solid var(--line); font-size: 11px; }
    .pulse-row span:last-child { color: var(--muted); }
    .agent-brief { margin-top: 20px; border: 1px solid rgba(180,239,223,.18); background: rgba(180,239,223,.045); border-radius: 14px; padding: 14px; }
    .agent-brief p { color: #b6bfbc; font-size: 11px; line-height: 1.55; }
    .agent-brief textarea { width: 100%; border: 1px solid var(--line); border-radius: 9px; background: #0f1213; color: var(--ink); padding: 10px; resize: none; min-height: 68px; }

    /* Prototype-only controls and overlays. */
    .switcher { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 50; display: grid; grid-template-columns: 38px auto 38px; align-items: center; background: #f4f7f6; color: #152023; border: 1px solid rgba(0,0,0,.14); border-radius: 999px; padding: 5px; box-shadow: 0 12px 36px rgba(0,0,0,.35); }
    .switcher button { width: 36px; height: 34px; border: 0; border-radius: 50%; background: transparent; color: #152023; cursor: pointer; font-size: 18px; }
    .switcher button:hover { background: #dfe8e5; }
    .switcher-label { min-width: 180px; text-align: center; font-size: 12px; font-weight: 750; padding: 0 10px; }
    .prototype-state { position: fixed; right: 12px; bottom: 12px; z-index: 40; width: min(300px,calc(100vw - 24px)); background: rgba(8,12,14,.94); border: 1px solid rgba(255,255,255,.14); color: #dce7e4; border-radius: 10px; box-shadow: var(--shadow); }
    .prototype-state .state-toggle { width: 100%; padding: 9px 11px; border: 0; background: transparent; color: #8da09a; text-align: left; cursor: pointer; font-size: 10px; text-transform: uppercase; letter-spacing: .1em; }
    .prototype-state .state-toggle::before { content: "\25B8  "; }
    .prototype-state.expanded .state-toggle::before { content: "\25BE  "; }
    .prototype-state pre { white-space: pre-wrap; margin: 0; padding: 0 11px 11px; font: 10px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace; max-height: 180px; overflow: auto; }
    .overlay { position: fixed; inset: 0; z-index: 60; background: rgba(4,8,10,.7); backdrop-filter: blur(8px); display: grid; place-items: center; padding: 24px; }
    .modal { width: min(690px,100%); max-height: min(780px,90vh); overflow: auto; background: #121a1d; color: #edf4f2; border: 1px solid rgba(255,255,255,.12); border-radius: 18px; box-shadow: 0 30px 100px rgba(0,0,0,.6); padding: 21px; }
    .modal.light { background: #fbfcfa; color: #202729; }
    .modal-head { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; margin-bottom: 16px; }
    .modal-head h2 { margin: 4px 0; font-size: 20px; }
    .close-button { border: 1px solid rgba(255,255,255,.12); border-radius: 9px; background: transparent; padding: 7px 10px; cursor: pointer; }
    .modal.light .close-button { border-color: rgba(0,0,0,.12); }
    .history-search { width: 100%; border: 1px solid rgba(255,255,255,.12); color: inherit; background: rgba(255,255,255,.04); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
    .modal.light .history-search { border-color: rgba(0,0,0,.12); background: #fff; }
    .history-item { display: grid; grid-template-columns: 74px 1fr; gap: 12px; padding: 13px 0; border-top: 1px solid rgba(255,255,255,.09); }
    .modal.light .history-item { border-color: rgba(0,0,0,.09); }
    .history-time { font-size: 10px; color: #82928e; }
    .history-item b { font-size: 12px; }
    .history-item p { font-size: 11px; color: #8fa09c; line-height: 1.45; margin: 4px 0 0; }
    .settings-grid { display: grid; grid-template-columns: 170px 1fr; gap: 16px; }
    .settings-menu button { display: block; width: 100%; text-align: left; border: 0; border-radius: 8px; padding: 9px; color: #9ca9a6; background: transparent; }
    .settings-menu button.active { color: #edf4f2; background: rgba(255,255,255,.06); }
    .setting-field { margin-bottom: 14px; }
    .setting-field label { display: block; font-size: 11px; color: #91a09d; margin-bottom: 6px; }
    .setting-field textarea, .setting-field select { width: 100%; border: 1px solid rgba(255,255,255,.12); background: #0e1517; color: #eaf1ef; border-radius: 9px; padding: 10px; }
    .skill-row { display: flex; flex-wrap: wrap; gap: 7px; }
    .skill-chip { padding: 7px 9px; border-radius: 8px; background: rgba(109,224,209,.08); border: 1px solid rgba(109,224,209,.18); color: #9be8dd; font-size: 11px; }
    .toast { position: fixed; top: 78px; left: 50%; transform: translateX(-50%); z-index: 80; padding: 10px 14px; border-radius: 9px; background: #eef5f3; color: #172224; box-shadow: var(--shadow); font-size: 12px; }
    @media (max-width: 1250px) {
      .a-shell { grid-template-columns: 70px 220px minmax(500px,1fr); }
      .a-case-rail .rail-label, .a-case-rail .case-row > div:nth-child(2), .a-case-rail .case-row > div:last-child, .a-agent { display: none; }
      .a-case-rail { padding-inline: 10px; }
      .a-case-rail .case-row { display: grid; grid-template-columns: 1fr; place-items: center; padding: 10px; }
      .c-shell { grid-template-columns: 220px 1fr; }
      .c-side { display: none; }
    }
    @media (max-width: 820px) {
      .a-topbar { grid-template-columns: auto 1fr; }
      .a-top-actions { display: none; }
      .a-shell { grid-template-columns: 62px 1fr; }
      .a-folders { display: none; }
      .summary-grid, .evidence-strip { grid-template-columns: 1fr; }
      .b-workspace { grid-template-columns: 1fr; }
      .b-sidebar { display: none; }
      .b-desk { grid-template-columns: 1fr; }
      .c-shell { grid-template-columns: 1fr; }
      .c-dock { display: none; }
      .story-card.feature { grid-template-columns: 1fr; }
      .prototype-state { display: none; }
    }
  </style>
</head>
<body>
  <main id="app" class="app"></main>
  <div id="overlay-root"></div>
  <aside class="prototype-state">
    <button type="button" class="state-toggle" data-action="toggle-state" aria-expanded="false">Prototype state</button>
    <pre id="state-output" hidden></pre>
  </aside>
  <nav class="switcher" aria-label="Prototype variants">
    <button type="button" data-switch="prev" aria-label="Previous variant">‹</button>
    <div id="switcher-label" class="switcher-label"></div>
    <button type="button" data-switch="next" aria-label="Next variant">›</button>
  </nav>
  <script>
    const variants = {
      A: { name: "Command center", render: renderA },
      B: { name: "Evidence desk", render: renderB },
      C: { name: "Briefing room", render: renderC }
    };

    const folders = [
      ["Overview", 12], ["People", 8], ["Accounts", 14], ["Locations", 6],
      ["Media", 23], ["Documents", 9], ["Web captures", 31], ["Findings", 5]
    ];

    const state = {
      variant: new URLSearchParams(location.search).get("variant")?.toUpperCase() || "A",
      activeFolder: "Overview",
      activeView: "Summary",
      model: "Codex · GPT-5.6",
      agentMode: "Research within limits",
      search: "",
      selectedArtifact: "Station camera 04",
      caseId: "M-1042",
      caseName: "Riley Mercer",
      access: "Sensitive · 4 members",
      fictionalData: true
    };
    if (!variants[state.variant]) state.variant = "A";

    const svgIcon = (name) => {
      const icons = {
        search: '<circle cx="11" cy="11" r="7"></circle><path d="m16.5 16.5 4 4"></path>',
        folder: '<path d="M3 7.5h7l2 2h9v9.5H3z"></path><path d="M3 7.5V5h7l2 2.5"></path>',
        history: '<path d="M4 5v5h5"></path><path d="M5.2 17.5a8 8 0 1 0-.8-8"></path><path d="M12 7v5l3 2"></path>',
        settings: '<circle cx="12" cy="12" r="3"></circle><path d="M19 13.5v-3l-2-.7-.7-1.7.9-1.9-2.2-2.1-1.8.9-1.8-.7L10.5 2h-3l-.7 2-1.8.7-1.8-.9-2.1 2.1.9 1.9-.7 1.7-2 .8v3l2 .7.7 1.8-.9 1.8 2.1 2.2 1.8-.9 1.8.7.7 2h3l.7-2 1.8-.7 1.8.9 2.2-2.2-.9-1.8.7-1.8z" transform="scale(.8) translate(3 3)"></path>',
        agent: '<path d="M7 8h10a4 4 0 0 1 4 4v5H3v-5a4 4 0 0 1 4-4z"></path><path d="M9 8V5m6 3V5M8 13h.01M16 13h.01M8 21h8"></path>',
        graph: '<circle cx="5" cy="12" r="2.5"></circle><circle cx="18" cy="6" r="2.5"></circle><circle cx="18" cy="18" r="2.5"></circle><path d="m7 11 8.5-4M7 13l8.5 4"></path>',
        file: '<path d="M6 2h8l4 4v16H6z"></path><path d="M14 2v5h5M9 12h6M9 16h6"></path>',
        image: '<rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="m4 18 5-5 4 4 3-3 4 4"></path>',
        map: '<path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3z"></path><path d="M9 3v15M15 6v15"></path>',
        close: '<path d="m5 5 14 14M19 5 5 19"></path>',
        plus: '<path d="M12 5v14M5 12h14"></path>',
        more: '<circle cx="5" cy="12" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle>'
      };
      return `<span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24">${icons[name] || icons.file}</svg></span>`;
    };

    const stationArt = () => `
      <div class="case-photo">
        <svg viewBox="0 0 600 280" preserveAspectRatio="xMidYMid slice" aria-label="Stylized fictional train station camera still" role="img">
          <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#315a66"/><stop offset="1" stop-color="#101a1e"/></linearGradient></defs>
          <rect width="600" height="280" fill="url(#sky)"/><rect y="177" width="600" height="103" fill="#11181b"/>
          <path d="M0 182 600 151M0 226l600-31" stroke="#75878b" stroke-width="4" opacity=".6"/>
          <path d="M80 0v180M230 0v170M440 0v160" stroke="#0d171a" stroke-width="16" opacity=".7"/>
          <rect x="325" y="73" width="118" height="75" fill="#dce3d8" opacity=".16"/><path d="M349 172v-49c0-14 12-26 26-26s26 12 26 26v49" fill="#171c1e"/>
          <circle cx="375" cy="83" r="18" fill="#1b2022"/><rect x="361" y="118" width="29" height="74" rx="8" fill="#1b2022"/>
          <path d="m364 191-17 61m39-61 20 61" stroke="#1b2022" stroke-width="13"/>
          <rect x="16" y="16" width="118" height="26" rx="4" fill="#071013" opacity=".7"/><text x="29" y="34" fill="#b5d4d7" font-size="12" font-family="monospace">CAM 04 · 20:42:16</text>
        </svg>
      </div>`;

    const citation = (label) => `<button class="citation" data-preview="${label}">${label}</button>`;

    function renderA() {
      return `<section class="variant-a">
        <header class="a-topbar">
          <div class="brand"><span class="brand-mark"></span>AI OSINT Spider <span class="tag">Prototype</span></div>
          <label class="global-search">${svgIcon("search")}<span class="sr-only">Global search</span><input data-search placeholder="Search every Case, person, link, or finding" value="${state.search}"/><span class="pill">Ctrl K</span></label>
          <div class="a-top-actions"><span class="pill good"><span class="status-dot"></span>Agent researching</span><button class="tool-button" data-action="history">${svgIcon("history")}History</button><button class="tool-button" data-action="settings">${svgIcon("settings")}</button><span class="avatar">AM</span></div>
        </header>
        <div class="a-shell">
          <nav class="a-case-rail" aria-label="Cases">
            <div class="rail-label">Cases</div>
            ${[["RM","Riley Mercer","M-1042","active"],["NH","North Harbor","CY-302",""],["LC","Ledger Coast","FI-091",""]].map(c=>`<button class="case-row ${c[3]}"><span class="case-badge">${c[0]}</span><div><div class="case-code">${c[2]}</div><div class="case-name">${c[1]}</div></div><div class="status-dot"></div></button>`).join("")}
            <button class="case-row"><span class="case-badge">${svgIcon("plus")}</span><div><div class="case-name">New Case</div></div></button>
          </nav>
          <aside class="a-folders">
            <div class="rail-label">Case material</div>
            ${folders.slice(0,4).map(folderRowA).join("")}
            <div class="folder-children">${folders.slice(4).map(folderRowA).join("")}</div>
            <div class="rail-label" style="margin-top:22px">Saved views</div>
            ${["Needs review","Uncited claims","Added this week"].map(x=>`<button class="folder-row">${svgIcon("search")} ${x}</button>`).join("")}
          </aside>
          <section class="a-main">
            <div class="case-heading"><div><div class="eyebrow">Missing person · Fictional demo</div><h1>Riley Mercer</h1><div class="muted fine">Case M-1042 · Last updated 12 minutes ago · ${state.access}</div></div><div class="case-heading-actions"><button class="tool-button" data-action="settings">${svgIcon("settings")}Case settings</button><button class="tool-button primary">New research</button></div></div>
            <div class="view-tabs">${["Summary","Evidence","People","Timeline","Map","Graph"].map(x=>`<button class="view-tab ${state.activeView===x?'active':''}" data-view="${x}">${x}</button>`).join("")}</div>
            <div class="summary-grid">
              <article class="card summary-card"><div class="eyebrow">Current cited brief</div><h2>Last confirmed at Northline Station</h2><p>Riley appears in station camera 04 at 20:42 on August 18, carrying a dark backpack and moving toward the east platform ${citation("E-14")}. A transit receipt found in the user-provided documents matches the station and time window ${citation("E-07")}.</p><p>The linked public profile became inactive about three hours earlier. Similar usernames found elsewhere remain candidate links and have not been merged ${citation("O-22")}.</p><div class="story-meta"><span class="pill good">3 supported statements</span><span class="pill warn">2 items need review</span><button class="story-link">Open full brief</button></div></article>
              <aside class="card summary-card"><div class="eyebrow">Signals</div><h2>What changed</h2><div class="signal-list"><div class="signal"><span class="signal-bar"></span><div><b>New location lead</b><div>Transit archive suggests an eastbound service disruption.</div></div></div><div class="signal"><span class="signal-bar" style="background:var(--cyan)"></span><div><b>Account connection</b><div>One username match has a public proof; identity still needs review.</div></div></div></div></aside>
            </div>
            <div class="brief-title"><h2>Evidence worth opening</h2><button class="story-link">View all 87 items</button></div>
            <div class="evidence-strip">
              <button class="card evidence-card" data-preview="E-14">${stationArt()}<div class="evidence-meta"><b>Station camera 04</b><span>Image · Complete capture · Verified digest</span></div></button>
              <button class="card evidence-card" data-preview="E-07"><div class="case-photo" style="display:grid;place-items:center;min-height:112px;background:linear-gradient(145deg,#443829,#17130e)">${svgIcon("file")}<span style="font-size:11px">Transit receipt</span></div><div class="evidence-meta"><b>Northline receipt</b><span>PDF · User provided · OCR complete</span></div></button>
              <button class="card evidence-card" data-preview="O-22"><div class="case-photo" style="display:grid;place-items:center;min-height:112px;background:linear-gradient(145deg,#263c49,#10171c)">${svgIcon("graph")}<span style="font-size:11px">Candidate account link</span></div><div class="evidence-meta"><b>Public profile comparison</b><span>Web capture · AI inference · Needs review</span></div></button>
            </div>
          </section>
          <aside class="a-agent">
            <div class="a-agent-head"><div class="a-agent-title"><span class="status-dot"></span><div><b style="font-size:12px">Case agent</b><div class="muted" style="font-size:9px">Research within limits</div></div></div><button class="plain-button">${svgIcon("more")}</button></div>
            <select class="model-select" data-model><option>Codex · GPT-5.6</option><option>Claude · Sonnet 4.6</option><option>OpenAI API · GPT-5.4</option></select>
            <div class="agent-event"><span class="event-icon">1</span><div><b>Searching transit notices</b><p>Browser · northline.example/archive<br/>2 of 5 pages checked</p></div></div>
            <div class="agent-event"><span class="event-icon">2</span><div><b>Comparing public usernames</b><p>Username connector · 8 candidate Sources<br/>No identities merged</p></div></div>
            <div class="agent-event"><span class="event-icon">3</span><div><b>Waiting for review</b><p>One possible relationship needs an investigator decision.</p></div></div>
            <button class="tool-button" style="width:100%;justify-content:center;margin-top:8px" data-action="agent">Open live work</button>
            <div class="chat-box"><textarea placeholder="Ask the Case agent a question"></textarea><button class="tool-button primary" style="width:100%;justify-content:center;margin-top:7px">Send</button></div>
          </aside>
        </div>
      </section>`;
    }

    function folderRowA([name,count]) { return `<button class="folder-row ${state.activeFolder===name?'active':''}" data-folder="${name}">${svgIcon(name==='Overview'?'file':'folder')} ${name}<span>${count}</span></button>`; }

    function renderB() {
      return `<section class="variant-b">
        <header class="b-header"><div class="brand"><span class="brand-mark"></span>AI OSINT Spider</div><div class="b-breadcrumb"><span>Cases</span><span>/</span><b>Riley Mercer</b><span class="tag">Fictional</span></div><label class="b-case-search">${svgIcon("search")}<input data-search placeholder="Search inside this Case" value="${state.search}"/></label><button class="tool-button" data-action="history">${svgIcon("history")}</button><span class="avatar">AM</span></header>
        <div class="b-workspace">
          <aside class="b-sidebar"><div class="b-case-card"><div class="eyebrow">M-1042 · Missing person</div><h2>Riley Mercer</h2><p>87 artifacts · 5 findings · 2 need review</p></div><div class="rail-label">Collections</div>${folders.map(([n,c])=>`<button class="b-folder ${state.activeFolder===n?'active':''}" data-folder="${n}">${svgIcon(n==='Overview'?'file':'folder')} ${n}<strong>${c}</strong></button>`).join("")}<div class="rail-label" style="margin-top:22px">Case tools</div><button class="b-folder" data-action="settings">${svgIcon("settings")}Instructions & skills</button><button class="b-folder">${svgIcon("graph")}Open relationship graph</button></aside>
          <main class="b-main"><div class="b-toolbar"><button class="tool-button primary">${svgIcon("plus")}Add information</button><button class="tool-button">Sort: relevance</button><button class="tool-button">Filter</button><div class="b-toolbar-spacer"></div><select class="tool-button" data-model><option>Codex · GPT-5.6</option><option>Claude · Sonnet 4.6</option></select><button class="tool-button" data-action="agent">${svgIcon("agent")}Agent working</button></div>
          <section class="b-canvas"><div class="eyebrow" style="margin-bottom:8px">Evidence queue · ${state.activeFolder}</div><div class="b-queue">${[["IMG","Station camera 04","20:42 · Verified"],["PDF","Transit receipt","User provided"],["WEB","Public profile","Captured yesterday"],["TXT","Witness note","Needs review"],["MAP","East platform","6 linked items"]].map((x,i)=>`<button class="queue-card ${i===0?'selected':''}" data-preview="${i===0?'E-14':'E-0'+(7+i)}"><span class="queue-icon">${x[0]}</span><b>${x[1]}</b><span>${x[2]}</span></button>`).join("")}</div>
          <div class="b-desk"><article class="document-viewer"><div class="doc-head"><div><b>Station camera 04</b><div style="font-size:10px;color:#9dacaf;margin-top:3px">E-14 · PNG · SHA-256 verified</div></div><span class="pill good">Complete capture</span></div><div class="doc-stage">${stationArt()}</div><div class="doc-footer"><span>Northline Station · Camera archive</span><span>Captured Aug 19, 09:13</span></div></article>
          <aside class="notebook"><article class="paper"><div class="eyebrow">Agent note</div><h3>Why this matters</h3><p>This is the latest source with a confirmed time and location. The clothing description agrees with the intake note, but the direction of travel remains an inference.</p><div class="b-agent-prompt"><input placeholder="Ask about this artifact"/><button class="tool-button primary">Ask</button></div></article><article class="paper"><div class="eyebrow">Extracted details</div><div class="fact-row"><b>Observed time</b><span>20:42:16 · Directly visible</span></div><div class="fact-row"><b>Location</b><span>Northline Station · Source metadata</span></div><div class="fact-row"><b>Direction</b><span>East platform · AI inference · 72% match score</span></div></article><article class="paper"><div class="eyebrow">Linked material</div><div style="display:grid;gap:8px;margin-top:10px">${linkPreview("Transit service archive","northline.example/notices/aug-18","NL")}${linkPreview("Public profile capture","social.example/riley-m","RP")}</div></article></aside></div></section></main>
        </div>
      </section>`;
    }

    function linkPreview(title,url,initials) { return `<button class="link-preview" data-preview="${title}"><span class="link-thumb">${initials}</span><span><span class="link-title">${title}</span><span class="link-url">${url}</span></span></button>`; }

    function renderC() {
      return `<section class="variant-c"><div class="c-shell">
        <nav class="c-dock" aria-label="Primary">
          <div class="dock-brand"><div class="dock-logo">AS</div><div><b>AI OSINT Spider</b><small>Investigation workspace</small></div></div>
          <div class="dock-label">Workspace</div>
          <button class="dock-button active">${svgIcon("file")}<span>Case brief</span></button>
          <button class="dock-button">${svgIcon("folder")}<span>Case material</span></button>
          <button class="dock-button">${svgIcon("graph")}<span>Relationship graph</span></button>
          <button class="dock-button">${svgIcon("map")}<span>Map and timeline</span></button>
          <button class="dock-button" data-action="history">${svgIcon("history")}<span>Case history</span></button>
          <div class="dock-label">Recent Cases</div>
          <button class="dock-case active"><span class="mini-avatar">RM</span><span><b>Riley Mercer</b><small>M-1042 · Missing person</small></span><span class="case-state"></span></button>
          <button class="dock-case"><span class="mini-avatar">NH</span><span><b>North Harbor</b><small>CY-302 · Cyber</small></span></button>
          <button class="dock-case"><span class="mini-avatar">LC</span><span><b>Ledger Coast</b><small>FI-091 · Financial</small></span></button>
          <span class="dock-spacer"></span>
          <button class="dock-button" data-action="settings">${svgIcon("settings")}<span>Settings and Skills</span></button>
          <div class="dock-profile"><span class="avatar">AM</span><span><b>Alex Morgan</b><small>Investigator</small></span></div>
        </nav>
        <main class="c-brief"><label class="c-command">${svgIcon("search")}<input data-search placeholder="Ask or search this Case, press Enter" value="${state.search}"/><span class="pill">Global search</span></label><header class="c-header"><div class="eyebrow">Case M-1042 · Missing person · Fictional demo</div><h1>Where was Riley last confirmed?</h1><div class="c-header-line"><span class="pill good">Cited brief current</span><span class="pill">87 artifacts</span><span class="pill warn">2 need review</span><button class="story-link" data-action="settings">Case settings</button></div></header>
        <section class="brief-section"><div class="brief-title"><h2>The clearest account</h2><span class="muted fine">Updated 12 minutes ago</span></div><div class="narrative"><article class="story-card feature"><div><div class="eyebrow">Confirmed · August 18, 20:42</div><h3>Northline Station is the last supported location.</h3><p>Station camera 04 shows Riley moving through the main concourse with a dark backpack. The timestamp aligns with a transit receipt found in the original Case intake ${citation("E-14")} ${citation("E-07")}.</p><div class="story-meta"><button class="story-link" data-preview="E-14">Open camera still</button><span class="muted fine">2 independent sources</span></div></div>${stationArt()}</article>
        <article class="story-card"><div class="eyebrow">Likely · August 18, 20:46</div><h3>Eastbound travel is plausible, not established.</h3><p>A service notice and platform geometry support the route, but no capture shows Riley boarding. The agent has kept this as an Inference rather than a Finding ${citation("I-09")}.</p><div class="story-meta"><span class="pill warn">Needs investigator review</span><button class="story-link" data-preview="Transit service archive">Inspect sources</button></div></article>
        <article class="story-card"><div class="eyebrow">Unresolved · Digital identity</div><h3>Two public accounts may be related.</h3><p>One account shares Riley's established handle. Another has a similar photograph but no public proof. Neither account has been merged with Riley's Entity ${citation("O-22")}.</p><div class="story-meta"><button class="story-link">Compare accounts</button><span class="muted fine">No automated identity merge</span></div></article></div></section></main>
        <aside class="c-side"><div class="pulse-head"><h2>Case pulse</h2><button class="plain-button" data-action="settings">${svgIcon("settings")}</button></div><div class="pulse-number">68%</div><div class="pulse-label">of collected material reviewed by a person</div><div class="pulse-row"><span>Supported Findings</span><span>5</span></div><div class="pulse-row"><span>Open Leads</span><span>7</span></div><div class="pulse-row"><span>Uncited Claims</span><span>2</span></div><div class="pulse-row"><span>Last collection</span><span>12m</span></div><div class="agent-brief"><div class="eyebrow">Case agent · Working</div><p>Checking five transit notices and comparing eight candidate usernames. No external engagement is enabled.</p><select class="model-select" data-model><option>Codex · GPT-5.6</option><option>Claude · Sonnet 4.6</option></select><textarea placeholder="Ask the Case agent"></textarea><button class="tool-button primary" style="width:100%;justify-content:center;margin-top:7px" data-action="agent">Open live work</button></div><button class="tool-button" style="width:100%;justify-content:center;margin-top:12px" data-action="history">${svgIcon("history")}Search Case history</button></aside>
      </div></section>`;
    }

    function render() {
      document.getElementById("app").innerHTML = variants[state.variant].render();
      document.getElementById("switcher-label").textContent = `${state.variant} · ${variants[state.variant].name}`;
      document.getElementById("state-output").textContent = JSON.stringify(state, null, 2);
      document.querySelectorAll("[data-model]").forEach(select => { select.value = state.model; });
    }

    function switchVariant(direction) {
      const keys = Object.keys(variants);
      const next = (keys.indexOf(state.variant) + direction + keys.length) % keys.length;
      state.variant = keys[next];
      const url = new URL(location.href);
      url.searchParams.set("variant", state.variant);
      history.replaceState({}, "", url);
      closeOverlay();
      render();
    }

    function showArtifact(label) {
      const light = state.variant === "B" ? "light" : "";
      document.getElementById("overlay-root").innerHTML = `<div class="overlay" role="dialog" aria-modal="true" aria-label="Artifact preview"><section class="modal ${light}"><div class="modal-head"><div><div class="eyebrow">Artifact preview</div><h2>${label}</h2><div class="muted fine">Captured source with provenance and review state</div></div><button class="close-button" data-close>Close</button></div>${stationArt()}<div class="summary-grid" style="margin-top:14px"><div><div class="eyebrow">Source</div><p class="fine">Northline Station public camera archive<br/>Captured August 19 at 09:13 · Complete capture</p></div><div><div class="eyebrow">Integrity</div><p class="fine">SHA-256 verified<br/>Supports 2 Claims · Contradicts 0</p></div></div><button class="tool-button primary" style="margin-top:12px">Open in evidence desk</button></section></div>`;
    }

    function showHistory() {
      const items = [
        ["12 min", "Agent added a proposed location Lead", "Transit notice linked to Northline Station. Awaiting investigator review."],
        ["28 min", "Web capture preserved", "Public profile captured as Artifact O-22 with a complete source record."],
        ["1 hr", "Case summary regenerated", "Version 8 cites 5 Findings and identifies 2 unresolved Claims."],
        ["Yesterday", "Jordan Kim accepted a Finding", "Station camera timestamp accepted after reviewing E-14 and E-07."],
        ["Aug 19", "Case created", "Morgan Ellis created Case M-1042 from the Missing person template."]
      ];
      document.getElementById("overlay-root").innerHTML = `<div class="overlay" role="dialog" aria-modal="true"><section class="modal ${state.variant==='B'?'light':''}"><div class="modal-head"><div><div class="eyebrow">Append-only Case history</div><h2>Everything that changed</h2></div><button class="close-button" data-close>Close</button></div><input class="history-search" data-history-search placeholder="Search actor, action, source, run, or date"/><div id="history-list">${items.map(historyMarkup).join("")}</div></section></div>`;
      document.querySelector("[data-history-search]").addEventListener("input", e => {
        const query = e.target.value.toLowerCase();
        document.getElementById("history-list").innerHTML = items.filter(x=>x.join(" ").toLowerCase().includes(query)).map(historyMarkup).join("") || '<p class="muted fine">No history entries match.</p>';
      });
    }

    function historyMarkup(item) { return `<div class="history-item"><span class="history-time">${item[0]}</span><div><b>${item[1]}</b><p>${item[2]}</p></div></div>`; }

    function showSettings() {
      document.getElementById("overlay-root").innerHTML = `<div class="overlay" role="dialog" aria-modal="true"><section class="modal"><div class="modal-head"><div><div class="eyebrow">Case settings</div><h2>Agent instructions and tools</h2></div><button class="close-button" data-close>Close</button></div><div class="settings-grid"><nav class="settings-menu"><button class="active">Agent</button><button>Authorization</button><button>Members</button><button>Sources</button><button>Models</button><button>History</button></nav><div><div class="setting-field"><label>Case model</label><select data-modal-model><option>Codex · GPT-5.6</option><option>Claude · Sonnet 4.6</option><option>OpenAI API · GPT-5.4</option></select></div><div class="setting-field"><label>Case instructions</label><textarea rows="5">Prioritize last-known-location evidence. Keep identity matches as candidates until a person reviews them. Cite every summary statement.</textarea></div><div class="setting-field"><label>Global instructions · Read only here</label><textarea rows="3" readonly>Separate observations, inferences, and accepted findings. Preserve provenance.</textarea></div><div class="setting-field"><label>Enabled Skills</label><div class="skill-row"><span class="skill-chip">Missing-person intake</span><span class="skill-chip">Source verification</span><span class="skill-chip">Timeline reconstruction</span><button class="tool-button">Manage Skills</button></div></div><button class="tool-button primary">Save new settings version</button></div></div></section></div>`;
    }

    function showAgent() {
      document.getElementById("overlay-root").innerHTML = `<div class="overlay" role="dialog" aria-modal="true"><section class="modal"><div class="modal-head"><div><div class="eyebrow">Live Research run</div><h2>Transit and identity research</h2><div class="muted fine">Codex · GPT-5.6 · Research within limits</div></div><button class="close-button" data-close>Close</button></div><div class="signal-list"><div class="signal"><span class="signal-bar" style="background:var(--cyan)"></span><div><b>Parent agent · Running</b><div>Coordinating two visible subagents · 18 minutes and 61 actions remain</div></div></div><div class="signal"><span class="signal-bar"></span><div><b>Transit researcher · Browser active</b><div>Opening northline.example/archive · 2 of 5 notices checked</div></div></div><div class="signal"><span class="signal-bar" style="background:#7791ff"></span><div><b>Identity researcher · Connector active</b><div>Comparing 8 candidate accounts · No Entity merges permitted</div></div></div></div><div style="display:flex;gap:8px;margin-top:16px"><button class="tool-button">Pause selected</button><button class="tool-button">Stop selected</button><button class="tool-button" style="color:#ff9b9b">Emergency stop all</button></div></section></div>`;
    }

    function closeOverlay() { document.getElementById("overlay-root").innerHTML = ""; }
    function toast(message) { const node=document.createElement("div"); node.className="toast"; node.textContent=message; document.body.appendChild(node); setTimeout(()=>node.remove(),2200); }

    document.addEventListener("click", event => {
      const target = event.target.closest("button, [data-preview]");
      if (!target) return;
      if (target.dataset.switch) switchVariant(target.dataset.switch === "next" ? 1 : -1);
      if (target.dataset.folder) { state.activeFolder = target.dataset.folder; render(); }
      if (target.dataset.view) { state.activeView = target.dataset.view; toast(`${target.dataset.view} view selected for comparison`); render(); }
      if (target.dataset.preview) { state.selectedArtifact = target.dataset.preview; showArtifact(target.dataset.preview); document.getElementById("state-output").textContent = JSON.stringify(state,null,2); }
      if (target.dataset.action === "toggle-state") {
        const panel = target.closest(".prototype-state");
        const expanded = panel.classList.toggle("expanded");
        panel.querySelector("pre").hidden = !expanded;
        target.setAttribute("aria-expanded", String(expanded));
      }
      if (target.dataset.action === "history") showHistory();
      if (target.dataset.action === "settings") showSettings();
      if (target.dataset.action === "agent") showAgent();
      if (target.hasAttribute("data-close")) closeOverlay();
    });
    document.addEventListener("change", event => {
      if (event.target.matches("[data-model]")) { state.model = event.target.value; document.getElementById("state-output").textContent = JSON.stringify(state,null,2); toast(`Case model changed to ${state.model}`); }
      if (event.target.matches("[data-modal-model]")) state.model = event.target.value;
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeOverlay();
      const editing = event.target.matches("input, textarea, select, [contenteditable]");
      if (!editing && event.key === "ArrowLeft") switchVariant(-1);
      if (!editing && event.key === "ArrowRight") switchVariant(1);
      if (event.key === "Enter" && event.target.matches("[data-search]")) { state.search = event.target.value; document.getElementById("state-output").textContent = JSON.stringify(state,null,2); toast(state.search ? `Searching this prototype for “${state.search}”` : "Search cleared"); }
    });
    document.getElementById("overlay-root").addEventListener("click", event => { if (event.target.classList.contains("overlay")) closeOverlay(); });
    render();
  </script>
</body>
</html>
